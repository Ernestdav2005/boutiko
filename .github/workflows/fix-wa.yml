name: Fix homePage wa
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-wa.yml'
      - 'scripts/fix-wa.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/fix-wa.py
      - name: Commit
        run: |
          git config user.name boutiko-fix
          git config user.email noreply@github.com
          git add src/index.js
          git commit -m "Fix: wa defined on homePage" || echo no
          git push
