name: Restore index.js
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore working index.js from commit 5037e24
        run: |
          git show 5037e24b8072b539062e40e4484ec2a93e48fba4:src/index.js > src/index.js
          wc -c src/index.js
          head -c 120 src/index.js
          node --check src/index.js
          git config user.name "boutiko-restore"
          git config user.email "noreply@github.com"
          git add src/index.js
          git commit -m "URGENT restore index.js from 5037e24 (avant placeholder accidentel)" || echo "No change"
          git push
