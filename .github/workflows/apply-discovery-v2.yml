name: Apply discovery storefront v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-discovery-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch index.js for discovery look
        run: |
          python3 << 'PY'
          from pathlib import Path
          src = Path("src/index.js").read_text()
          if "discover-cover" in src:
              print("Already discovery")
              raise SystemExit(0)
          if "clock:" not in src:
              src = src.replace(
                  "  lock: '<rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>',\n};",
                  "  lock: '<rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/>',\n  clock: '<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>',\n};",
                  1,
              )
              print("clock added")
          replacements = [
              ('class="cover has-img"', 'class="discover-cover has-img"'),
              ('class="cover no-img"', 'class="discover-cover no-img"'),
              ('class="avatar"', 'class="discover-avatar"'),
              ('class="shop-slogan"', 'class="discover-slogan"'),
              ('class="shop-id"', 'class="discover-id-text"'),
              ('class="brand-eyebrow"', 'class="discover-brand"'),
              ('class="idrow"', 'class="discover-identity wrap"'),
              ('class="shop-story"', 'class="discover-gallery"'),
              ('bodyAttrs: `data-slug=', 'bodyAttrs: `class="discover-page" data-slug='),
          ]
          for old, new in replacements:
              c = src.count(old)
              if c:
                  src = src.replace(old, new)
                  print(f"applied {old[:35]} x{c}")
              else:
                  print(f"skip {old[:35]}")
          Path("src/index.js").write_text(src)
          print("done", "discover-cover" in src)
          PY
          node --check src/index.js
      - name: Append discovery CSS
        run: |
          if grep -q discover-cover src/client/style.txt; then
            echo CSS already present
          else
            cat >> src/client/style.txt << 'CSSEOF'

/* ===== PAGE DÉCOUVERTE BOUTIQUE ===== */
.discover-page{background:var(--bg)}
.discover-cover{height:200px;background-size:cover;background-position:center;position:relative}
.discover-cover.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,.45))}
.discover-cover.no-img{background:radial-gradient(ellipse 90% 70% at 80% 10%,color-mix(in srgb,var(--c) 40%,#fff),transparent 60%),linear-gradient(155deg,color-mix(in srgb,var(--c) 88%,#000) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 70%,#fff) 100%);height:160px}
@media(min-width:700px){.discover-cover{height:260px}.discover-cover.no-img{height:180px}}
.discover-identity{display:flex;gap:18px;align-items:flex-end;margin-top:-52px;position:relative;z-index:3;padding-bottom:8px}
.discover-avatar{width:96px;height:96px;border-radius:24px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:2.2rem;font-weight:800;flex:0 0 96px;overflow:hidden;border:5px solid #fff;box-shadow:var(--shadow-md)}
.discover-avatar img{width:100%;height:100%;object-fit:cover}
.discover-id-text{padding-bottom:6px;min-width:0;flex:1}
.discover-brand{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.discover-name{margin:0;font-size:1.75rem;letter-spacing:-.03em;line-height:1.15;word-break:break-word;color:var(--ink)}
.discover-slogan{font-size:1.08rem;font-weight:650;color:var(--ink);margin:8px 0 6px;letter-spacing:-.01em;line-height:1.35}
.discover-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700;margin-top:6px}
.discover-badge.open{background:#d8f5e5;color:#0d6b34}
.discover-badge.closed{background:#fde8e8;color:#9b1c1c}
.discover-infobar{background:#fff;border-bottom:1px solid var(--bd);padding:14px 0 18px}
.discover-infos{display:flex;flex-wrap:wrap;gap:10px 18px;margin-bottom:14px;font-size:.94rem}
.discover-info-item{display:flex;gap:8px;align-items:flex-start}
.discover-actions{display:flex;flex-wrap:wrap;gap:10px}
.discover-section-title{margin:0 0 16px}
.discover-section-title span{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.discover-section-title h2{font-size:1.35rem;margin:0}
.discover-about{padding:28px 16px 8px}
.discover-desc{font-size:1.02rem;line-height:1.6;max-width:52ch}
.discover-gallery{padding:24px 16px 8px}
.discover-products{padding:28px 0 40px}
.discover-hint{text-align:center;margin-top:20px;color:var(--mut)}
.discover-foot{text-align:center;color:var(--mut);padding:28px 16px 100px;font-size:.9rem;border-top:1px solid var(--bd);background:#fff}
.discover-page .prod{border-radius:20px}
@media(max-width:480px){.discover-avatar{width:80px;height:80px;border-radius:20px;font-size:1.9rem}.discover-identity{margin-top:-44px}.discover-name{font-size:1.45rem}}
CSSEOF
            echo CSS appended
          fi
      - name: Commit and push
        run: |
          git config user.name "boutiko-discovery"
          git config user.email "noreply@github.com"
          git add src/index.js src/client/style.txt
          git commit -m "Vitrine découverte: page entreprise claire + produits bien mis en valeur" || echo no-change
          git push
