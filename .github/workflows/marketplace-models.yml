name: Marketplace modeles Boutiko
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/marketplace-models.yml'
      - 'scripts/apply-mkt.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply marketplace
        run: python3 scripts/apply-mkt.py
      - name: Commit
        run: |
          git config user.name boutiko-marketplace
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "Marketplace: 9 modeles, filtres, parcours creation boutique" || echo no
          git push
