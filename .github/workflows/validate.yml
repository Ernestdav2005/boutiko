name: Validate Boutiko

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.zip"
      - ".github/workflows/extract-project.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Wrangler configuration and bundle
        run: npx wrangler deploy --dry-run
