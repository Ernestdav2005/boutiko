name: Extract Boutiko project archive

on:
  push:
    paths:
      - "boutiko-projet.zip"
      - ".github/workflows/extract-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          test -f boutiko-projet.zip
          mkdir -p /tmp/boutiko-project
          unzip -oq boutiko-projet.zip -d /tmp/boutiko-project
          cp -a /tmp/boutiko-project/. .
          rm -rf src/.git
          git status --short

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Boutiko project source files"
            git push
          else
            echo "No extracted file changes to commit."
          fi
