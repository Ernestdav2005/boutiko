name: Launch ready
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/launch-ready.yml'
      - 'scripts/apply-launch.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/apply-launch.py
      - name: Commit
        run: |
          git config user.name boutiko-launch
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "Launch-ready: trust, how-it-works, FAQ, mobile nav, CTA Shopify" || echo no
          git push
