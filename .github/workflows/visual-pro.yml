name: Visual pro homepage
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/visual-pro.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inject visual CSS
        run: |
          python3 << 'PY'
          from pathlib import Path
          css = r'''
          /* BOUTIKO VISUAL PRO */
          body.home-models,body.v2{background:#f7f7f8!important;color:#0a0a0b;font-family:Inter,system-ui,sans-serif!important}
          .v2-ribbon{display:none!important}
          .home-models .hero-models{padding:64px 0 80px!important;background:#0a0a0b!important;color:#fff!important}
          .home-models .hero-models::after{display:none!important}
          .home-models .hero-models h1{font-size:clamp(2rem,5vw,3.2rem)!important;line-height:1.08!important;letter-spacing:-.035em!important;max-width:14ch!important;font-weight:800!important;color:#fff!important}
          .home-models .hero-models h1 em{color:#fff!important;border-bottom:3px solid #f59e0b!important;font-style:normal!important}
          .home-models .hero-models .lead{color:#a1a1aa!important;font-size:1.15rem!important}
          .home-models .hero-models .btn{background:#fff!important;color:#0a0a0b!important;border-radius:12px!important;font-weight:700!important;padding:14px 22px!important}
          .home-models .hero-models .btn.ghost{background:transparent!important;color:#fff!important;border:1.5px solid #3f3f46!important}
          .tpl-marketplace{display:grid!important;gap:28px!important;grid-template-columns:1fr!important}
          @media(min-width:720px){.tpl-marketplace{grid-template-columns:1fr 1fr!important}}
          @media(min-width:1040px){.tpl-marketplace{grid-template-columns:1fr 1fr 1fr!important}}
          .tpl-card{background:#fff!important;border:1px solid #e4e4e7!important;border-radius:20px!important;overflow:hidden!important;box-shadow:0 12px 40px rgba(0,0,0,.06)!important;transition:transform .2s,box-shadow .2s!important}
          .tpl-card:hover{transform:translateY(-6px)!important;box-shadow:0 20px 50px rgba(0,0,0,.12)!important;border-color:#0a0a0b!important}
          .tpl-shot{display:block!important;aspect-ratio:16/10!important;padding:0!important;position:relative!important;overflow:hidden!important;background:#18181b!important}
          .tpl-device{display:none!important}
          .tpl-shot::before{content:"";position:absolute;inset:0;background-size:cover;background-position:center}
          .tpl-simple .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=800&q=80")}
          .tpl-quartier .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1556740738-b6a63e27c4df?w=800&q=80")}
          .tpl-express .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=800&q=80")}
          .tpl-vitrine .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1468495244123-6c6c332eeece?w=800&q=80")}
          .tpl-catalogue .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&q=80")}
          .tpl-mode .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800&q=80")}
          .tpl-premium .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1445205170230-053b83016050?w=800&q=80")}
          .tpl-maison .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=800&q=80")}
          .tpl-flagship .tpl-shot::before{background-image:url("https://images.unsplash.com/photo-1441984904996-e0b241748a7c?w=800&q=80")}
          .tpl-preview-label{position:absolute!important;bottom:12px;right:12px;z-index:2;background:rgba(10,10,11,.9)!important;color:#fff!important;font-size:.7rem!important;font-weight:700!important;padding:6px 12px!important;border-radius:999px!important}
          .tpl-meta{padding:20px!important}
          .tpl-meta h3{font-size:1.25rem!important;letter-spacing:-.02em!important}
          .tpl-plan{background:#0a0a0b!important;color:#fff!important}
          .tpl-cta .btn{background:#0a0a0b!important;color:#fff!important;border-radius:10px!important;font-weight:700!important}
          .tpl-cta .btn.ghost{background:#fff!important;color:#0a0a0b!important;border:1.5px solid #e4e4e7!important}
          .tpl-filters button{border-radius:999px!important;padding:10px 18px!important;font-weight:700!important}
          .tpl-filters button.on{background:#0a0a0b!important;color:#fff!important;border-color:#0a0a0b!important}
          '''
          sty = Path("src/client/style.txt").read_text()
          m = "/* BOUTIKO VISUAL PRO */"
          if m in sty:
            sty = sty[:sty.find(m)].rstrip()
          Path("src/client/style.txt").write_text(sty + "\n" + css)
          print("css ok", len(css))
          PY
      - name: Commit
        run: |
          git config user.name boutiko-visual
          git config user.email noreply@github.com
          git add src/client/style.txt
          git commit -m "Visual pro: hero sombre + photos reelles sur modeles" || echo no
          git push
