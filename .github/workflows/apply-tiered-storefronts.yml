name: Apply tiered storefronts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-tiered-storefronts.yml'
      - 'scripts/payload-fn-0.txt'
      - 'scripts/payload-fn-1.txt'
      - 'scripts/payload-fn-2.txt'
      - 'scripts/payload-css.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild shopPage + CSS from payloads
        run: |
          python3 << 'PY'
          from pathlib import Path
          import base64
          src = Path('src/index.js').read_text()
          if 'sf-pro-hero' in src and 'sf-page' in src:
              print('already applied')
          else:
              if 'clock:' not in src and 'lock:' in src:
                  m = src.find('M8 11V8a4 4 0 0 1 8 0v3')
                  if m > 0:
                      c = src.find('\n};', m)
                      if c > 0:
                          src = src[:c] + "\n  clock: '<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>'," + src[c:]
                          print('clock')
              b64 = Path('scripts/payload-fn-0.txt').read_text().strip() + Path('scripts/payload-fn-1.txt').read_text().strip() + Path('scripts/payload-fn-2.txt').read_text().strip()
              fn = base64.b64decode(b64).decode()
              start = src.find('async function shopPage(')
              end = src.find('\nfunction notFound(', start)
              assert start > 0 and end > start, (start, end)
              Path('src/index.js').write_text(src[:start] + fn + src[end:])
              print('shopPage ok', 'sf-pro-hero' in fn)
          css = Path('src/client/style.txt').read_text()
          if 'VITRINES PAR FORMULE' not in css:
              extra = base64.b64decode(Path('scripts/payload-css.txt').read_text().strip()).decode()
              Path('src/client/style.txt').write_text(css.rstrip() + '\n' + extra)
              print('css ok')
          else:
              print('css present')
          PY
          node --check src/index.js
          grep -c sf-pro-hero src/index.js
          grep -c 'VITRINES PAR FORMULE' src/client/style.txt
      - name: Commit and push
        run: |
          git config user.name boutiko-tiers
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "Vitrines par formule: Essentiel, Standard, Pro" || echo no-change
          git push
