name: Restore both files
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/restore-both.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore from 5037e24
        run: |
          git show 5037e24b8072b539062e40e4484ec2a93e48fba4:src/index.js > src/index.js
          git show 5037e24b8072b539062e40e4484ec2a93e48fba4:src/client/style.txt > src/client/style.txt
          wc -c src/index.js src/client/style.txt
          node --check src/index.js
          git config user.name boutiko-restore
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "URGENT restore index.js + style.txt (stable)" || echo no
          git push
