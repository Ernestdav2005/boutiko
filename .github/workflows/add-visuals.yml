name: Add real visuals homepage
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-visuals.yml'
      - 'scripts/apply-visuals.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/apply-visuals.py
      - name: Commit
        run: |
          git config user.name boutiko-visuals
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "Visuels reels: photos modeles + bandeau presentation" || echo no
          git push
