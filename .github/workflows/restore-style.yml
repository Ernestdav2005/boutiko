name: Restore style.txt
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-style.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore style from 5037e24
        run: |
          git show 5037e24b8072b539062e40e4484ec2a93e48fba4:src/client/style.txt > src/client/style.txt
          wc -c src/client/style.txt
          git config user.name boutiko-restore
          git config user.email noreply@github.com
          git add src/client/style.txt
          git commit -m "URGENT restore style.txt" || echo no
          git push
