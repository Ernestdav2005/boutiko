name: Fix SW cache + force home
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-sw-home.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix service worker
        run: |
          python3 << 'PY'
          from pathlib import Path
          import subprocess
          src = Path("src/index.js").read_text()
          start = src.find("PWA_SW = `")
          end = src.find("`;", start)
          assert start > 0 and end > start, (start, end)
          new_sw = (
          "PWA_SW = `const CACHE=\"boutiko-shell-v3\";\n"
          "const SHELL=[\"/style.css\",\"/app.js\",\"/icon.svg\",\"/manifest.webmanifest\"];\n"
          "self.addEventListener(\"install\",e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(SHELL)).then(()=>self.skipWaiting()))});\n"
          "self.addEventListener(\"activate\",e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});\n"
          "self.addEventListener(\"fetch\",e=>{\n"
          "  const u=new URL(e.request.url);\n"
          "  if(e.request.method!==\"GET\"||u.origin!==self.location.origin)return;\n"
          "  if(u.pathname.startsWith(\"/api/\")||u.pathname.startsWith(\"/img/\")||u.pathname.startsWith(\"/admin\"))return;\n"
          "  if(u.pathname===\"/\"||u.pathname===\"/app\"||u.pathname.startsWith(\"/modele\")||e.request.mode===\"navigate\"){\n"
          "    e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));\n"
          "    return;\n"
          "  }\n"
          "  if(SHELL.includes(u.pathname)){\n"
          "    e.respondWith(fetch(e.request).then(r=>{if(r.ok){const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));}return r;}).catch(()=>caches.match(e.request)));\n"
          "  }\n"
          "});`"
          )
          src = src[:start] + new_sw + src[end+2:]
          old = '<meta name="viewport" content="width=device-width,initial-scale=1">'
          new = old + '<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">'
          if "no-store, must-revalidate" not in src:
            src = src.replace(old, new, 1)
          Path("src/index.js").write_text(src)
          r = subprocess.run(["node", "--check", "src/index.js"], capture_output=True, text=True)
          print(r.stderr or "syntax OK")
          raise SystemExit(r.returncode)
          PY
      - name: Commit
        run: |
          git config user.name boutiko-fix
          git config user.email noreply@github.com
          git add src/index.js
          git commit -m "FIX: SW v3 network-first - plus jamais ancienne home en cache" || echo no
          git push
