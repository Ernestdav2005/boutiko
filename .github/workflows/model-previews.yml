name: Model previews real
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/model-previews.yml'
      - 'scripts/apply-model-previews.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/apply-model-previews.py
      - name: Commit
        run: |
          git config user.name boutiko-models
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "Apercus modeles boutique + template applique a la vitrine" || echo no
          git push
