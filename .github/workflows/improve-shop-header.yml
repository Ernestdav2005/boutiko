name: Improve shop header
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/improve-shop-header.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch discovery base
        run: |
          python3 << 'PY'
          from pathlib import Path
          src = Path("src/index.js").read_text()
          if "discover-cover" in src:
              print("already")
          else:
              pairs = [
                ('class="cover has-img"', 'class="discover-cover has-img"'),
                ('class="cover no-img"', 'class="discover-cover no-img"'),
                ('class="avatar"', 'class="discover-avatar"'),
                ('class="brand-eyebrow"', 'class="discover-brand"'),
                ('class="idrow"', 'class="discover-identity"'),
                ('class="shop-id"', 'class="discover-id-text"'),
                ('class="shop-slogan"', 'class="discover-slogan"'),
                ('class="sdesc"', 'class="discover-desc"'),
                ('class="shophead"', 'class="discover-hero"'),
                ('class="shop-story"', 'class="discover-gallery"'),
                ('<h1>${name}</h1>', '<h1 class="discover-name">${name}</h1>'),
              ]
              for o,n in pairs:
                  if o in src:
                      src = src.replace(o, n)
                      print("ok", o[:40])
              # body class for base + pro marker
              old_ba = 'bodyAttrs: `data-slug="${esc(shop.slug)}" data-name="${name}" data-theme="${theme}" data-layout="${productLayout}"'
              new_ba = 'bodyAttrs: `class="discover-page" data-plan="${esc(shop.plan||"essentiel")}" data-slug="${esc(shop.slug)}" data-name="${name}" data-theme="${theme}" data-layout="${productLayout}"'
              if old_ba in src:
                  src = src.replace(old_ba, new_ba, 1)
                  print("bodyAttrs")
              # section title products
              if "Nos produits" not in src or "discover-section-title" not in src:
                  src = src.replace(
                      '<main class="wrap">${many',
                      '<section class="discover-products"><div class="wrap"><div class="discover-section-title"><span>Catalogue</span><h2>Nos produits</h2></div>${many',
                      1)
                  src = src.replace(
                      '<main class="wrap"><div class="empty">',
                      '<section class="discover-products"><div class="wrap"><div class="discover-section-title"><span>Catalogue</span><h2>Nos produits</h2></div><div class="empty">',
                      1)
                  print("sections")
              Path("src/index.js").write_text(src)
              print("discover-cover", "discover-cover" in src)
          # PLANS: mark pro as premium storefront
          src = Path("src/index.js").read_text()
          if "premiumStorefront" not in src:
              src = src.replace(
                  'pro: { label: "Pro", price: 10000, products: 300, photos: 3, storageMb: 160, custom: true },',
                  'pro: { label: "Pro", price: 10000, products: 300, photos: 3, storageMb: 160, custom: true, premiumStorefront: true },',
              )
              Path("src/index.js").write_text(src)
              print("pro flag")
          PY
          node --check src/index.js
      - name: CSS base discovery
        run: |
          if grep -q 'PAGE DECOUVERTE' src/client/style.txt; then echo css-ok; else
          cat >> src/client/style.txt << 'EOF'

/* ===== PAGE DECOUVERTE (base + pro) ===== */
.discover-page{background:var(--bg)}
.discover-hero{position:relative;background:#fff;border-bottom:1px solid var(--bd)}
.discover-cover{height:200px;background-size:cover;background-position:center;position:relative}
.discover-cover.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,.45))}
.discover-cover.no-img{background:radial-gradient(ellipse 90% 70% at 80% 10%,color-mix(in srgb,var(--c) 40%,#fff),transparent 60%),linear-gradient(155deg,color-mix(in srgb,var(--c) 88%,#000),var(--c));height:160px}
@media(min-width:700px){.discover-cover{height:260px}.discover-cover.no-img{height:180px}}
.discover-identity{display:flex;gap:16px;align-items:flex-end;margin-top:-48px;position:relative;z-index:3;padding:0 16px 16px}
.discover-avatar{width:92px;height:92px;border-radius:22px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:2.1rem;font-weight:800;flex:0 0 92px;overflow:hidden;border:5px solid #fff;box-shadow:var(--shadow-md)}
.discover-avatar img{width:100%;height:100%;object-fit:cover}
.discover-id-text{min-width:0;padding-bottom:4px}
.discover-brand{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 2px}
.discover-name{margin:0;font-size:1.7rem;letter-spacing:-.03em;line-height:1.15;word-break:break-word}
.discover-slogan{font-size:1.05rem;font-weight:650;margin:8px 0 4px;color:var(--ink)}
.discover-desc{font-size:1rem;line-height:1.55;color:var(--mut);margin:.35rem 0 0}
.discover-section-title{margin:0 0 14px}
.discover-section-title span{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.discover-section-title h2{font-size:1.3rem;margin:0}
.discover-products{padding:24px 0 36px}
.discover-gallery{padding:16px;background:#fff;border-bottom:1px solid var(--bd)}
.discover-page .prod{border-radius:20px}
.discover-page .prod:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
/* Pro premium polish (data-plan=pro) */
body[data-plan="pro"].discover-page .discover-cover{height:240px}
body[data-plan="pro"].discover-page .discover-name{font-size:1.95rem;letter-spacing:-.04em}
body[data-plan="pro"].discover-page .discover-avatar{width:104px;height:104px;border-radius:26px}
body[data-plan="pro"].discover-page .discover-products .prod{border:1px solid transparent;box-shadow:var(--shadow-md)}
body[data-plan="pro"].discover-page .discover-section-title h2{font-size:1.5rem}
@media(max-width:480px){
  .discover-avatar{width:76px;height:76px;border-radius:18px;font-size:1.8rem}
  .discover-name{font-size:1.4rem}
  .discover-identity{margin-top:-40px}
}
EOF
          echo css-appended; fi
      - name: Commit
        run: |
          git config user.name boutiko-improve
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "Vitrine découverte base + polish Pro (10k)" || echo no
          git push
