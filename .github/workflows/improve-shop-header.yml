name: Improve shop header
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/improve-shop-header.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply premium shop header patch
        run: |
          python3 << 'PY'
          import base64
          with open("src/index.js") as f:
              src = f.read()
          if "cover has-img" in src:
              print("Already improved, skipping")
              raise SystemExit(0)
          old = base64.b64decode("").decode()
          new = base64.b64decode("").decode()
          if old not in src:
              print("Old block not found!")
              idx = src.find("const galleryIds")
              print("galleryIds at", idx)
              raise SystemExit(1)
          src2 = src.replace(old, new, 1)
          with open("src/index.js", "w") as f:
              f.write(src2)
          print("Patched successfully, new size:", len(src2))
          PY
          git config user.name "boutiko-improve"
          git config user.email "noreply@github.com"
          git add src/index.js
          git commit -m "Header boutique premium: cover, galerie cliquable, nom en grand"
          git push
