name: Improve shop header
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/improve-shop-header.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply small precise patches
        run: |
          python3 << 'PY'
          with open("src/index.js") as f:
              src = f.read()
          if "cover has-img" in src:
              print("Already improved")
              raise SystemExit(0)

          replacements = [
              (
                  'class="shop-story wrap"',
                  'class="shop-story"'
              ),
              (
                  "Découvrez notre univers",
                  "Notre univers"
              ),
              (
                  'const banner = shop.banner_id && plan.custom ? `<div class="banner" style="background-image:url(/img/${shop.banner_id})"></div>` : "";',
                  'const banner = shop.banner_id && plan.custom\n    ? `<div class="cover has-img" style="background-image:url(/img/${shop.banner_id})"></div>`\n    : `<div class="cover no-img" style="--c:${color}"></div>`;'
              ),
              (
                  '${galleryIds.map((id, i) => `<img src="/img/${id}" loading="lazy" alt="Photo ${i + 1} de ${name}">`).join("")}',
                  '${galleryIds.map((id, i) => `<button type="button" class="story-shot" data-lightbox="/img/${id}" aria-label="Voir la photo ${i + 1}"><img src="/img/${id}" loading="lazy" alt="Photo ${i + 1} de ${name}"></button>`).join("")}'
              ),
              (
                  '? `<div class="avatar"><img src="/img/${shop.logo_id}" alt=""></div>`',
                  '? `<div class="avatar"><img src="/img/${shop.logo_id}" alt="Logo ${name}"></div>`'
              ),
              (
                  '<div class="idrow">${avatar}<div><h1>${name}</h1>',
                  '<div class="idrow">${avatar}<div class="shop-id"><h1>${name}</h1>'
              ),
              (
                  '<div class="awning"></div><header class="shophead">',
                  '<header class="shophead">'
              ),
          ]

          for i, (old, new) in enumerate(replacements):
              if old in src:
                  src = src.replace(old, new, 1)
                  print(f"Applied patch {i}")
              else:
                  print(f"Skip patch {i} (not found)")

          with open("src/index.js", "w") as f:
              f.write(src)
          print("Done. cover has-img:", "cover has-img" in src)
          print("data-lightbox:", "data-lightbox" in src)
          PY
          git config user.name "boutiko-improve"
          git config user.email "noreply@github.com"
          git add src/index.js
          git diff --cached --stat
          git commit -m "Header boutique premium: cover, galerie cliquable, nom en grand" || echo "nothing to commit"
          git push
