name: Boutiko 2.0 design
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/boutiko-v2.yml'
      - 'scripts/v2-css.b64'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v2 design
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import base64
          src = Path('src/index.js').read_text()
          if 'v2-ribbon' not in src:
              src = src.replace(
                  'const body = `<header class="hero hero-models">',
                  'const body = `<div class="v2-ribbon">BOUTIKO 2.0 — Modeles de boutiques · Essentiel · Standard · Pro</div><header class="hero hero-models">',
                  1)
              print('ribbon')
          if 'v2-badge' not in src:
              for old in [
                  "<p class=\"eyebrow\">MODELES DE BOUTIQUES PRETS A L'EMPLOI</p>",
                  "<p class=\"eyebrow\">MODÈLES DE BOUTIQUES PRÊTS À L'EMPLOI</p>",
              ]:
                  if old in src:
                      src = src.replace(old, '<span class="v2-badge">Version 2.0</span>' + old, 1)
                      print('badge')
                      break
          if 'class="home-models"' in src and 'home-models v2' not in src:
              src = src.replace('class="home-models"', 'class="home-models v2"', 1)
              print('class v2')
          if 'style.css?v=2' not in src:
              src = src.replace('href="/style.css"', 'href="/style.css?v=2.0"', 1)
              print('cache')
          Path('src/index.js').write_text(src)
          css = Path('src/client/style.txt').read_text()
          if 'BOUTIKO 2.0' not in css:
              extra = base64.b64decode(Path('scripts/v2-css.b64').read_text().strip()).decode()
              Path('src/client/style.txt').write_text(css.rstrip() + '\n' + extra)
              print('css')
          print('done')
          PY
          node --check src/index.js
          grep -c v2-ribbon src/index.js
          grep -c 'BOUTIKO 2.0' src/client/style.txt
      - name: Commit
        run: |
          git config user.name boutiko-v2
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "Boutiko 2.0 — design visible (ruban + couleurs + modeles)" || echo no
          git push
