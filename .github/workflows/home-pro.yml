name: Homepage pro platform
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/home-pro.yml'
      - 'scripts/apply-home-pro.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 scripts/apply-home-pro.py
      - name: Commit
        run: |
          git config user.name boutiko-home
          git config user.email noreply@github.com
          git add src/index.js src/client/style.txt
          git commit -m "Accueil pro: nav Connexion Inscription, presentation jeunes entrepreneurs" || echo no
          git push
